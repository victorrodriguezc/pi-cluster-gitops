apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-assistant
spec:
  replicas: 1
  selector:
    matchLabels:
      app: home-assistant
  template:
    metadata:
      labels:
        app: home-assistant
    spec:
      hostNetwork: true
      initContainers:
      - name: init-config
        image: busybox
        command:
        - sh
        - -c
        - |
          if [ ! -f /config/configuration.yaml ]; then
            cat > /config/configuration.yaml << 'EOF'
          default_config:

          frontend:
            themes: !include_dir_merge_named themes

          automation: !include automations.yaml
          script: !include scripts.yaml
          scene: !include scenes.yaml

          homeassistant:
            external_url: "https://homeassistant.victorlab.work"
            internal_url: "http://home-assistant.homeassistant.svc.cluster.local:8123"

          http:
            use_x_forwarded_for: true
            trusted_proxies:
              - 10.42.0.0/16
          
          wake_on_lan:
          
          emulated_hue:
            host_ip: 192.168.50.222
            listen_port: 80
            expose_by_default: false
            entities:
              automation.turn_on_lg_tv:
                name: "TV Sala"
                hidden: false

          EOF
          fi
        volumeMounts:
        - mountPath: /config
          name: config
      containers:
      - name: home-assistant
        image: ghcr.io/home-assistant/home-assistant:stable
        ports:
        - containerPort: 8123
        env:
        - name: TZ
          value: Europe/Stockholm
        volumeMounts:
        - mountPath: /config
          name: config
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: home-assistant-config