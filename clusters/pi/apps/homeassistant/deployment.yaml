apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-assistant
spec:
  replicas: 1
  selector:
    matchLabels:
      app: home-assistant
  template:
    metadata:
      labels:
        app: home-assistant
    spec:
      initContainers:
      - name: init-config
        image: busybox
        command:
        - sh
        - -c
        - |
          if [ ! -f /config/configuration.yaml ]; then
            cat > /config/configuration.yaml << 'EOF'
          default_config:

          frontend:
            themes: !include_dir_merge_named themes

          automation: !include automations.yaml
          script: !include scripts.yaml
          scene: !include scenes.yaml

          http:
            use_x_forwarded_for: true
            trusted_proxies:
              - 10.42.0.0/16
          EOF
          fi
        volumeMounts:
        - mountPath: /config
          name: config
      containers:
      - name: home-assistant
        image: ghcr.io/home-assistant/home-assistant:stable
        ports:
        - containerPort: 8123
        env:
        - name: TZ
          value: Europe/Stockholm
        volumeMounts:
        - mountPath: /config
          name: config
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: home-assistant-config